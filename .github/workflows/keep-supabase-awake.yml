# Evita que el proyecto Supabase (plan gratuito) se pause por inactividad:
# Supabase pausa los proyectos gratuitos tras 7 días sin actividad. Este job
# consulta una RPC pública de solo lectura una vez al día.
# Secrets del repositorio: SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY (clave publicable, no la secreta).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 11 * * *' # diario, 07:17 en Santo Domingo
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar catálogo público
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_store_info" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase respondió correctamente."
